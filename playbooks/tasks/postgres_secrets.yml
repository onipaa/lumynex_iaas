---
- name: Log in to OpenBao
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/openbao-login"
  delegate_to: localhost
  become: false
  register: openbao_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Require an OpenBao login
  ansible.builtin.assert:
    that:
      - openbao_login.rc == 0
    fail_msg: "{{ openbao_login.stderr | default('OpenBao login failed.') }}"

- name: Ensure one sysmaint password
  ansible.builtin.include_tasks: postgres_sysmaint.yml
  loop: "{{ tier_members }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Check the cluster secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - "{{ postgres_openbao_kv_prefix }}/cl{{ postgres_cluster_id }}/cluster"
      - postgres_password
  delegate_to: localhost
  become: false
  register: cluster_secret_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate the postgres password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: generated_postgres_password
  changed_when: false
  no_log: true
  when: cluster_secret_check.rc != 0

- name: Generate the replicator password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: generated_replicator_password
  changed_when: false
  no_log: true
  when: cluster_secret_check.rc != 0

- name: Store the cluster passwords
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - "{{ postgres_openbao_kv_prefix }}/cl{{ postgres_cluster_id }}/cluster"
      - "postgres_password={{ generated_postgres_password.stdout }}"
      - "replicator_password={{ generated_replicator_password.stdout }}"
      - "scope=lumynex-cl{{ postgres_cluster_id }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: cluster_secret_check.rc != 0

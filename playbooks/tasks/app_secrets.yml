---
- name: Log in to OpenBao
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/openbao-login"
  delegate_to: localhost
  become: false
  register: openbao_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Require an OpenBao login
  ansible.builtin.assert:
    that:
      - openbao_login.rc == 0
    fail_msg: "{{ openbao_login.stderr | default('OpenBao login failed.') }}"

- name: Ensure one sysmaint password
  ansible.builtin.include_tasks: postgres_sysmaint.yml
  loop: "{{ tier_members }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Check the app cluster secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - "{{ app_openbao_kv_prefix }}/cl{{ app_cluster_id }}/cluster"
      - django_secret_key
  delegate_to: localhost
  become: false
  register: app_cluster_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Read the Postgres leader address
  ansible.builtin.command:
    cmd: >-
      awk '/^ansible_host:/{print $2; exit}'
      {{ playbook_dir }}/../inventory/host_vars/prhqv-cl1-postgresql-n1.yml
  delegate_to: localhost
  become: false
  register: app_database_host
  changed_when: false
  when: app_cluster_check.rc != 0

- name: Require the Postgres leader address
  ansible.builtin.assert:
    that:
      - app_database_host.stdout | default('') | length > 0
    fail_msg: >-
      prhqv-cl1-postgresql-n1 has no ansible_host.
      Configure Postgres before the app guests.
  when: app_cluster_check.rc != 0

- name: Generate the Django secret key
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: generated_django_secret
  changed_when: false
  no_log: true
  when: app_cluster_check.rc != 0

- name: Generate the app database password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: generated_app_db_password
  changed_when: false
  no_log: true
  when: app_cluster_check.rc != 0

- name: Store the app cluster secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - "{{ app_openbao_kv_prefix }}/cl{{ app_cluster_id }}/cluster"
      - "django_secret_key={{ generated_django_secret.stdout }}"
      - "database_host={{ app_database_host.stdout }}"
      - database_port=5432
      - database_name=lumynex
      - database_user=lumynex_app
      - "database_password={{ generated_app_db_password.stdout }}"
      - "scope=lumynex-cl{{ app_cluster_id }}-app"
  delegate_to: localhost
  become: false
  no_log: true
  when: app_cluster_check.rc != 0

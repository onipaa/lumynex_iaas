---
- name: Log in to OpenBao
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/openbao-login"
  delegate_to: localhost
  become: false
  register: openbao_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Require an OpenBao login
  ansible.builtin.assert:
    that:
      - openbao_login.rc == 0
    fail_msg: "{{ openbao_login.stderr | default('OpenBao login failed.') }}"

- name: Ensure one sysmaint password
  ansible.builtin.include_tasks: postgres_sysmaint.yml
  loop: "{{ tier_members }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Check the PgDog cluster secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - "{{ pgdog_openbao_kv_prefix }}/cl{{ pgdog_cluster_id }}/cluster"
      - admin_password
  delegate_to: localhost
  become: false
  register: pgdog_cluster_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate the PgDog admin password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: generated_pgdog_admin
  changed_when: false
  no_log: true
  when: pgdog_cluster_check.rc != 0

- name: Store the PgDog cluster secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - "{{ pgdog_openbao_kv_prefix }}/cl{{ pgdog_cluster_id }}/cluster"
      - "admin_password={{ generated_pgdog_admin.stdout }}"
      - listen_port=6432
      - "cluster_id={{ pgdog_cluster_id }}"
      - vip=192.168.4.170
      - "scope=lumynex-cl{{ pgdog_cluster_id }}-pgdog"
  delegate_to: localhost
  become: false
  no_log: true
  when: pgdog_cluster_check.rc != 0

---
- name: Log in to OpenBao
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/openbao-login"
  delegate_to: localhost
  become: false
  register: openbao_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Require an OpenBao login
  ansible.builtin.assert:
    that:
      - openbao_login.rc == 0
    fail_msg: "{{ openbao_login.stderr | default('OpenBao login failed.') }}"

- name: Ensure one sysmaint password
  ansible.builtin.include_tasks: postgres_sysmaint.yml
  loop: "{{ tier_members }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Check the load balancer secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - "{{ haproxy_secret_path }}"
      - keepalived_password
  delegate_to: localhost
  become: false
  register: loadbal_cluster_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Require a client address for the Django pair
  ansible.builtin.assert:
    that:
      - loadbal_vip is defined
      - loadbal_vip is match('^192\\.168\\.[4-7]\\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$')
    fail_msg: >-
      No client address is recorded for the Django load balancer.
      Re-run with -e loadbal_vip=<address> inside 192.168.4.0/22.
  when:
    - haproxy_pool == 'app'
    - loadbal_cluster_check.rc != 0

- name: Read the PgDog client address
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - secret/lumynex/pgdog/cl1/cluster
      - vip
  delegate_to: localhost
  become: false
  register: pgdog_vip
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - haproxy_pool == 'app'
    - loadbal_cluster_check.rc != 0

- name: Keep the PgDog client address on the PgDog pair
  ansible.builtin.assert:
    that:
      - pgdog_vip.rc != 0 or (loadbal_vip != pgdog_vip.stdout)
    fail_msg: >-
      {{ loadbal_vip }} is the PgDog client address.
      Pass a different -e loadbal_vip for the Django pair.
  when:
    - haproxy_pool == 'app'
    - loadbal_cluster_check.rc != 0

- name: Generate the keepalived password
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import secrets; alphabet='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; print(''.join(secrets.choice(alphabet) for _ in range(8)))
  delegate_to: localhost
  become: false
  register: generated_keepalived
  changed_when: false
  no_log: true
  when: loadbal_cluster_check.rc != 0

- name: Store the PgDog load balancer secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - "{{ haproxy_secret_path }}"
      - "keepalived_password={{ generated_keepalived.stdout }}"
      - "listen_port={{ haproxy_port }}"
      - "virtual_router_id={{ haproxy_virtual_router_id }}"
      - "scope=lumynex-cl1-loadbal-{{ haproxy_pool }}"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - loadbal_cluster_check.rc != 0
    - haproxy_pool == 'pgdog'

- name: Store the Django load balancer secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - "{{ haproxy_secret_path }}"
      - "keepalived_password={{ generated_keepalived.stdout }}"
      - "listen_port={{ haproxy_port }}"
      - "virtual_router_id={{ haproxy_virtual_router_id }}"
      - "vip={{ loadbal_vip }}"
      - "scope=lumynex-cl1-loadbal-{{ haproxy_pool }}"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - loadbal_cluster_check.rc != 0
    - haproxy_pool == 'app'

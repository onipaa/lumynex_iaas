---
- name: See whether the airport password exists
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - secret/lumynex/airport/cl1
      - password
  delegate_to: localhost
  become: false
  register: airport_password_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate an airport password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: airport_password_new
  changed_when: false
  no_log: true
  when: airport_password_check.rc != 0

- name: Generate an airport secret key
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: airport_secret_new
  changed_when: false
  no_log: true
  when: airport_password_check.rc != 0

- name: Store the airport secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - secret/lumynex/airport/cl1
      - "password={{ airport_password_new.stdout }}"
      - "secret_key={{ airport_secret_new.stdout }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: airport_password_check.rc != 0

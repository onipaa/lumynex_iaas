---
- name: See whether the PMM admin password exists
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - --check
      - secret/lumynex/pmm/cl1
      - admin_password
  delegate_to: localhost
  become: false
  register: pmm_admin_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate a PMM admin password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: pmm_admin_new
  changed_when: false
  no_log: true
  when: pmm_admin_check.rc != 0

- name: Generate a PMM monitor password
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/../scripts/new-password"
  delegate_to: localhost
  become: false
  register: pmm_monitor_new
  changed_when: false
  no_log: true
  when: pmm_admin_check.rc != 0

- name: Store the PMM secret
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-put"
      - secret/lumynex/pmm/cl1
      - "admin_password={{ pmm_admin_new.stdout }}"
      - "monitor_password={{ pmm_monitor_new.stdout }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: pmm_admin_check.rc != 0

- name: Read the PMM admin password
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - secret/lumynex/pmm/cl1
      - admin_password
  delegate_to: localhost
  become: false
  register: pmm_admin_get
  changed_when: false
  no_log: true

- name: Read the PMM monitor password
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/openbao-get"
      - secret/lumynex/pmm/cl1
      - monitor_password
  delegate_to: localhost
  become: false
  register: pmm_monitor_get
  changed_when: false
  no_log: true

- name: Publish the PMM passwords
  ansible.builtin.set_fact:
    pmm_admin_password: "{{ pmm_admin_get.stdout }}"
    pmm_monitor_password: "{{ pmm_monitor_get.stdout }}"
  no_log: true

---
# Clone one guest from a template onto one Proxmox node.
# Same role as teardown. Present is a no-op when that name already exists.
#
#   ansible-playbook playbooks/spin_guest.yml \
#     -e proxmox_node=prhqp-proxmox-1 \
#     -e vm_name=prhqv-cl1-app-n1 \
#     -e template_name=vanilla-26a

- name: Spin one Lumynex guest
  hosts: "{{ proxmox_node }}"
  gather_facts: false
  become: true

  tasks:
    - name: Create the guest
      ansible.builtin.include_role:
        name: proxmox_guest
      vars:
        proxmox_guest_state: present

---
- name: List cluster VMs
  ansible.builtin.command:
    cmd: pvesh get /cluster/resources --type vm --output-format json
  register: cluster_vms
  changed_when: false

- name: Match the guest
  ansible.builtin.set_fact:
    matched_guest: >-
      {{
        (cluster_vms.stdout | from_json)
        | selectattr('name', 'defined')
        | selectattr('name', 'equalto', vm_name)
        | selectattr('template', 'defined')
        | rejectattr('template', 'equalto', 1)
        | list
      }}

- name: Require exactly one guest
  ansible.builtin.assert:
    that:
      - matched_guest | length == 1
    fail_msg: "Expected one guest named {{ vm_name }}, found {{ matched_guest | length }}."

- name: Record the guest location
  ansible.builtin.set_fact:
    target_vmid: "{{ matched_guest[0].vmid }}"
    target_node: "{{ matched_guest[0].node }}"

- name: Wait for the QEMU guest agent
  ansible.builtin.command:
    cmd: "qm agent {{ target_vmid }} ping"
  delegate_to: "{{ (target_node in groups['proxmox']) | ternary(target_node, inventory_hostname) }}"
  register: guest_agent_ping
  until: guest_agent_ping.rc == 0
  retries: "{{ guest_agent_retries }}"
  delay: "{{ guest_agent_delay }}"
  changed_when: false

- name: Set the Linux hostname
  ansible.builtin.command:
    cmd: "qm guest exec {{ target_vmid }} -- hostnamectl set-hostname {{ vm_name }}"
  delegate_to: "{{ (target_node in groups['proxmox']) | ternary(target_node, inventory_hostname) }}"
  changed_when: true

- name: Read the controller public key
  ansible.builtin.set_fact:
    ssh_pubkey: "{{ lookup('file', ssh_pubkey_path) | trim }}"
  delegate_to: localhost
  become: false

- name: Install the public key
  ansible.builtin.shell: |
    set -euo pipefail
    B64="$(printf '%s' '{{ ssh_pubkey }}' | base64 | tr -d '\n')"
    HOME_DIR="{{ '/root' if guest_user == 'root' else '/home/' + guest_user }}"
    qm guest exec {{ target_vmid }} -- bash -lc "
      set -euo pipefail
      mkdir -p ${HOME_DIR}/.ssh
      chmod 700 ${HOME_DIR}/.ssh
      touch ${HOME_DIR}/.ssh/authorized_keys
      chmod 600 ${HOME_DIR}/.ssh/authorized_keys
      chown -R {{ guest_user }}:{{ guest_user }} ${HOME_DIR}/.ssh
      KEY=\"\$(printf '%s' '${B64}' | base64 -d)\"
      grep -qxF \"\${KEY}\" ${HOME_DIR}/.ssh/authorized_keys || printf '%s\n' \"\${KEY}\" >> ${HOME_DIR}/.ssh/authorized_keys
    "
  args:
    executable: /bin/bash
  delegate_to: "{{ (target_node in groups['proxmox']) | ternary(target_node, inventory_hostname) }}"
  changed_when: true

- name: Grant passwordless sudo
  ansible.builtin.shell: |
    set -euo pipefail
    LINE='{{ guest_user }} ALL=(ALL) NOPASSWD:ALL'
    B64="$(printf '%s\n' "${LINE}" | base64 | tr -d '\n')"
    qm guest exec {{ target_vmid }} -- bash -lc "
      set -euo pipefail
      printf '%s' '${B64}' | base64 -d > /etc/sudoers.d/90-{{ guest_user }}-ansible
      chmod 440 /etc/sudoers.d/90-{{ guest_user }}-ansible
      visudo -cf /etc/sudoers.d/90-{{ guest_user }}-ansible
    "
  args:
    executable: /bin/bash
  delegate_to: "{{ (target_node in groups['proxmox']) | ternary(target_node, inventory_hostname) }}"
  changed_when: true

- name: Read guest addresses
  ansible.builtin.command:
    cmd: "qm guest cmd {{ target_vmid }} network-get-interfaces"
  delegate_to: "{{ (target_node in groups['proxmox']) | ternary(target_node, inventory_hostname) }}"
  register: guest_nics
  changed_when: false

- name: Take the first non-loopback IPv4 address
  ansible.builtin.set_fact:
    guest_ip: >-
      {{
        (
          (
            (
              (guest_nics.stdout | from_json).result
              if (
                (guest_nics.stdout | from_json) is mapping
                and ((guest_nics.stdout | from_json).result is defined)
              )
              else (guest_nics.stdout | from_json)
            )
            | selectattr('name', 'defined')
            | rejectattr('name', 'equalto', 'lo')
            | map(attribute='ip-addresses')
            | select('defined')
            | list
            | flatten
            | selectattr('ip-address-type', 'defined')
            | selectattr('ip-address-type', 'equalto', 'ipv4')
            | map(attribute='ip-address')
            | reject('match', '^127\\.')
            | list
          ) | first | default('')
        )
      }}

- name: Require an address
  ansible.builtin.assert:
    that:
      - guest_ip | length > 0
    fail_msg: >-
      No IPv4 from the guest agent on {{ vm_name }}.
      The template needs qemu-guest-agent running.

- name: Publish the address for later plays
  ansible.builtin.add_host:
    name: "{{ vm_name }}"
    groups: "{{ guest_group }}"
    ansible_host: "{{ guest_ip }}"
    ansible_user: "{{ guest_user }}"

- name: Write host_vars
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../inventory/host_vars/{{ vm_name }}.yml"
    mode: "0644"
    content: |
      ---
      ansible_host: {{ guest_ip }}
      proxmox_vmid: {{ target_vmid }}
      proxmox_node: {{ target_node }}
  delegate_to: localhost
  become: false
